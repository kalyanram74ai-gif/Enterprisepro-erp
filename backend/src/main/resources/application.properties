# ===================================================================
# ENTERPRISEPRO ERP - Application Configuration
# ===================================================================

spring.application.name=enterprisepro-erp
server.port=8080
server.servlet.context-path=/

# -------------------------------------------------------------------
# Ensure unmapped routes raise NoHandlerFoundException (caught by
# GlobalExceptionHandler as JSON) instead of silently falling through
# to the HTML Whitelabel error page.
# -------------------------------------------------------------------
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false

# -------------------------------------------------------------------
# Active Profile (default uses H2 in-memory for instant plug & play,
# activate 'mysql' profile for full production MySQL persistence)
# -------------------------------------------------------------------
spring.profiles.active=dev

# -------------------------------------------------------------------
# Dev Profile (H2 In-Memory DB)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:enterprisepro_erp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# -------------------------------------------------------------------
# OpenAPI & Swagger UI
# -------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# -------------------------------------------------------------------
# File Upload & Multipart
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# -------------------------------------------------------------------
# Enterprise Settings
# -------------------------------------------------------------------
enterprisepro.company.name=ENTERPRISEPRO CORP
enterprisepro.company.email=admin@enterprisepro.com
enterprisepro.company.currency=USD
enterprisepro.audit.enabled=true
